input.addEventListener('blur',()=>finishName(i));input.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();finishName(i);label.focus()}if(e.key==='Escape'){e.preventDefault();finishName(i,true);label.focus()}});
card.addEventListener('keydown',e=>{if(e.target!==card)return;if(e.key==='Enter'){e.preventDefault();e.stopPropagation();slideCardIn(i)}if(e.key==='F2'){e.preventDefault();e.stopPropagation();editCardName(i)}});
let start=null,moved=false;
card.addEventListener('pointerdown',e=>{if(e.target.closest('button,input')||e.button!==0||cardMoving)return;start={x:e.clientX,y:e.clientY};moved=false;card.setPointerCapture(e.pointerId)});
card.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>7)moved=true;if(!moved)return;card.classList.add('dragging');card.parentElement.classList.add('dragging');card.style.transform=`translate(${dx}px,${dy}px)`;const slot=document.querySelector('.slot.'+(i?'two':'one'));slot.classList.toggle('drop-ready',openSlots[i])});
const clearDrag=()=>{start=null;card.classList.remove('dragging');card.parentElement.classList.remove('dragging');card.style.transform='';document.querySelectorAll('.drop-ready').forEach(s=>s.classList.remove('drop-ready'))};
card.addEventListener('pointerup',e=>{if(!start)return;const slot=document.querySelector('.slot.'+(i?'two':'one')).getBoundingClientRect();const hit=e.clientX>=slot.left-25&&e.clientX<=slot.right+25&&e.clientY>=slot.top-30&&e.clientY<=slot.bottom+45;const shouldInsert=!moved||hit;clearDrag();if(shouldInsert)slideCardIn(i)});
card.addEventListener('pointercancel',clearDrag);
});

syncSlots();draw();

let live=initial.live,mutedWarning=null,lastSound='',soundTime=0,bridgeReady=true;
activities.push(SY.drive);
document.body.classList.add('desktop-overlay');
function applyCards(show){document.body.classList.toggle('hide-cards',!show)}applyCards(live.settings.cardsVisible);
const activityIndex={rest:0,work:1,ready:2,drive:3};
function beep(){try{const audio=new (window.AudioContext||window.webkitAudioContext)();
if(is1381()){
// DTCO 1381: zwei kurze, höhere Pieptöne statt eines langen Tons.
[0,.14].forEach(delay=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=1046;const t=audio.currentTime+delay;gain.gain.setValueAtTime(.09,t);gain.gain.exponentialRampToValueAtTime(.001,t+.09);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.1)});
setTimeout(()=>{try{audio.close()}catch{}},420);
}else{
const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=880;gain.gain.setValueAtTime(.08,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.24);osc.onended=()=>audio.close()
}}catch{}}
const oldRenderLines=renderLines;
renderLines=function(){
if(live?.moving&&!live.drivers[0].inserted)return ['Fahren ohne','Karte'];
if(!notice&&view.type==='home'&&view.index===0&&live){const speed=live.connected?String(Math.round(live.speed)).padStart(3):'---';return [timeText()+'◷ ⊙ '+speed+'km/h',driverSymbol(0)+(live.drivers[0].inserted?'▣':' ')+' '+live.km.toFixed(1).padStart(8)+'km'+(live.drivers[1].inserted?'▣':' ')+driverSymbol(1)]}
if(!notice&&view.type==='home'&&(view.index===1||view.index===2)&&live){const i=view.index-1,r=live.rules[i];return [(i+1)+'⊙'+dur(r.daily)+' ▱'+dur(r.remainingBreak),'W '+dur(r.weekDrive)+' '+driverSymbol(i)+totals(i)]}
return oldRenderLines();
};
const oldDraw=draw;draw=function(){oldDraw();const noCard=live?.moving&&!live.drivers[0].inserted;if(noCard&&!blink){ctx.fillStyle='#62685c';ctx.fillRect(0,0,340,66)}document.querySelector('.lcd').classList.toggle('no-card-alert',!!noCard)};
const oldChangeActivity=changeActivity;changeActivity=function(i){if(live.moving){info('Aktivität','Fahrt aktiv');return}oldChangeActivity(i)};
const oldRequestCard=requestCard;requestCard=function(i){if(live.moving){info('▣ Auswurf','nicht möglich');return}oldRequestCard(i)};
const oldInsert=insert;insert=function(i){if(live.moving){info('▣ Karte','Bus anhalten!');return}oldInsert(i);save()};
const oldPress=press;press=function(k){if(k==='ok'&&notice?.trainingWarning){mutedWarning=notice.trainingWarning;notice=null;draw();return}if(live.moving&&view.type==='home'&&k==='ok'){info('Menüzugriff','nicht möglich');return}oldPress(k)};
const oldVehicleMenu=vehicleMenu;vehicleMenu=function(group){oldVehicleMenu(group);if(group==='Eingabe'&&view.type==='menu')view.nodes.push(entry('Einstellungen',()=>window.tachograph.action('settings')))};
// Read reports from the persisted timeline, not the old mock event array.
const originalReportSelect=reportSelect;
reportSelect=function(group,target,type,i){const next=day=>yesno('Ausdruck in','UTC-Zeit',async utc=>{try{const d=new Date(day);const dayStart=utc?Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1-1,d.getUTCDate()):new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();const dayEnd=utc?dayStart+86400000:new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const from=type==='Aktivitäten'?dayStart-6*86400000:dayStart;const report=await window.tachograph.action('report',{slot:i??0,all:i===null,from,to:dayEnd});const label={drive:'Lenkzeit',work:'Arbeit',ready:'Bereitschaft',rest:'Ruhe',unknown:'Unbekannt'};let lines=[deviceLabel()+' · SIM',target,i===null?'':state.drivers[i].name,dateText(day,!utc),utc?'UTC':'ORTSZEIT','EU561/ARV1: LINIE EIN','------------------------'];if(type==='Techn. Daten')lines.push(live.vehicle,'Speed: '+live.settings.unit);else if(type==='Karten')live.drivers.forEach((d,n)=>lines.push((n+1)+': '+(d.inserted?d.name:'leer')));else if(type.includes('Geschwindig'))lines.push('Keine Ueberschreitungsdaten');else if(type==='v-Diagramm'){lines.push('Stichproben, ca. 1 Minute');report.telemetry.filter((_,n)=>n%12===0).forEach(t=>lines.push(timeText(t.at,!utc)+' '+t.speed_kmh.toFixed(1)+'km/h '+ '|'.repeat(Math.min(20,Math.round(t.speed_kmh/5)))))}else if(type.includes('Ereignis')){for(const e of report.events){lines.push(timeText(e.at,!utc)+' '+e.type);const p=JSON.parse(e.payload);if(p.text)lines.push(p.text)}}else for(const s of report.segments)lines.push((s.driverName?s.driverName+' ':'')+timeText(s.start,!utc)+'-'+timeText(s.end,!utc)+' '+label[s.activity]);lines.push('------------------------',live.km.toFixed(3)+' km','KEIN AMTLICHER NACHWEIS');if(group==='Anzeige')show({type:'reading',index:0,lines:lines.flatMap(x=>{const result=[];for(let j=0;j<Math.max(1,x.length);j+=16)result.push(x.slice(j,j+16));return result})});else startPrint(lines)}catch(e){info('Datenfehler',String(e.message).slice(0,16))}},true);if(/Tageswert|Aktivitäten|Diagramm/.test(type))choose(type,Array.from({length:28},(_,n)=>Date.now()-n*86400000),next,0,x=>dateText(x,false));else next(Date.now())};
function receive(s){const wasMoving=live?.moving;live=s;state.km=s.km;applyModel(s.settings.deviceModel);applyNight(s.settings.nightMode);for(let i=0;i<2;i++){const a=s.drivers[i].activity;if(a!=='unknown')state.drivers[i].activity=activityIndex[a]??0}if(s.moving&&!wasMoving){if(flow){flow=null;home();info('Eingabe','abgebrochen')}else if(view.type!=='home')home()}
const a=s.alerts.find(x=>x.level!=='info'&&x.id!=='no-card');if(a&&!flow&&!printing&&view.type==='home'&&(!notice||notice.trainingWarning)){const key=a.id+':'+a.level+':'+s.rules[0].shift;if(key!==mutedWarning){const words=a.text.split(' ');let line1='',line2='';for(const w of words){if((line1+' '+w).trim().length<=16&&!line2)line1=(line1+' '+w).trim();else line2=(line2+' '+w).trim()}info(line1,line2.slice(0,16),8000);notice.trainingWarning=key;if(s.settings.sound&&key!==lastSound&&Date.now()-soundTime>10000){beep();lastSound=key;soundTime=Date.now()}}}
if(s.moving&&!s.drivers[0].inserted&&s.settings.sound&&Date.now()-soundTime>30000){beep();soundTime=Date.now()}draw()}
window.tachograph.onLive(receive);window.tachograph.onCommand(c=>{if(c.type==='cards')applyCards(c.visible);else if(c.type==='night')applyNight(c.on)});receive(live);

const splashUntil=Date.now()+5000;
const splashFont={'e':['00000','00000','01110','10001','11111','10000','01110'],'c':['00000','00000','01110','10000','10000','10001','01110'],'h':['10000','10000','10110','11001','10001','10001','10001'],'o':['00000','00000','01110','10001','10001','10001','01110'],'l':['01100','00100','00100','00100','00100','00100','01110'],'i':['00100','00000','01100','00100','00100','00100','01110'],'n':['00000','00000','10110','11001','10001','10001','10001'],'.':['00000','00000','00000','00000','00000','01100','01100'],'m':['00000','00000','11010','10101','10101','10101','10101']};
const drawBeforeSplash=draw;
draw=function(){if(Date.now()>=splashUntil){drawBeforeSplash();return}
ctx.fillStyle='#62685c';ctx.fillRect(0,0,340,66);ctx.fillStyle='#707568';for(let x=0;x<340;x+=3)for(let y=0;y<66;y+=3)ctx.fillRect(x,y,1,1);
const word='echolino.com',sc=4,w=word.length*6*sc-sc;let x=(340-w)/2;for(const ch of word){splashFont[ch].forEach((row,r)=>[...row].forEach((v,c)=>{if(v==='1'){ctx.fillStyle='#d9decf';ctx.fillRect(x+c*sc,19+r*sc,sc*.88,sc*.88)}}));x+=6*sc}
if($('#screenText').textContent!=='echolino.com')$('#screenText').textContent='echolino.com'};
draw();setTimeout(()=>draw(),splashUntil-Date.now()+50);


}
startDevice().catch(e=>{window.__bootError=e.stack||String(e);document.querySelector('#screenText').textContent='Startfehler: '+e.message;console.error(e)});
</script>
